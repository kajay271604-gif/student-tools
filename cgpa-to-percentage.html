<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CGPA to Percentage Calculator | Free Student Tool</title>

<meta name="description" content="Convert CGPA to percentage instantly using this free calculator. Perfect for college students and exam forms.">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    color: #555;
    font-size: 14px;
}

label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    background: #f4f6f8;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.links {
    text-align: center;
    margin-top: 15px;
}

.links a {
    color: #11998e;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
<h1>CGPA to Percentage</h1>
<p>Convert your CGPA into percentage instantly</p>

<label>Enter CGPA</label>
<input type="number" step="0.01" id="cgpa" placeholder="e.g. 8.5">

<button onclick="convert()">Convert</button>

<div class="result" id="result">Your percentage will appear here</div>

<div class="links">
<a href="age-calculator.html">Age Calculator</a> |
<a href="percentage-calculator.html">Percentage Calculator</a>
</div>
</div>

<script>
function convert() {
    const cgpa = document.getElementById("cgpa").value;
    if (cgpa === "" || cgpa < 0 || cgpa > 10) {
        document.getElementById("result").innerText = "Please enter valid CGPA (0–10)";
        return;
    }
    const percentage = (cgpa * 9.5).toFixed(2);
    document.getElementById("result").innerText =
        "Percentage: " + percentage + "%";
}
</script>

</body>
</html>
