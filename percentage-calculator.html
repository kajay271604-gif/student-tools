<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Percentage Calculator | Free Student Tool</title>

<meta name="description" content="Free percentage calculator for students. Calculate percentage easily from marks for exams and assignments.">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    color: #555;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    background: #f4f6f8;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.links {
    margin-top: 15px;
    text-align: center;
}

.links a {
    color: #16a34a;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
<h1>Percentage Calculator</h1>
<p>Calculate percentage easily</p>

<label>Obtained Marks</label>
<input type="number" id="obtained" placeholder="Enter obtained marks">

<label>Total Marks</label>
<input type="number" id="total" placeholder="Enter total marks">

<button onclick="calculatePercentage()">Calculate</button>

<div class="result" id="result">Result will appear here</div>

<div class="links">
<a href="word-counter.html">Word Counter</a> |
<a href="cgpa-to-percentage.html">CGPA Converter</a>
</div>
</div>

<script>
function calculatePercentage() {
    const obtained = document.getElementById("obtained").value;
    const total = document.getElementById("total").value;

    if (obtained === "" || total === "" || total == 0) {
        document.getElementById("result").innerText =
            "Please enter valid values.";
        return;
    }

    const percentage = (obtained / total) * 100;
    document.getElementById("result").innerText =
        "Percentage: " + percentage.toFixed(2) + "%";
}
</script>

</body>
</html>
