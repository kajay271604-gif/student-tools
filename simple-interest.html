<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Interest Calculator | Free Student Tool</title>

<meta name="description" content="Free simple interest calculator for students. Calculate simple interest instantly using principal, rate and time.">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #36d1dc, #5b86e5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    color: #555;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: linear-gradient(135deg, #36d1dc, #5b86e5);
    border: none;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    background: #f4f6f8;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.links {
    margin-top: 15px;
    text-align: center;
}

.links a {
    color: #5b86e5;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
<h1>Simple Interest</h1>
<p>Calculate simple interest easily</p>

<label>Principal Amount</label>
<input type="number" id="principal" placeholder="Enter principal">

<label>Rate of Interest (%)</label>
<input type="number" id="rate" placeholder="Enter rate">

<label>Time (Years)</label>
<input type="number" id="time" placeholder="Enter time">

<button onclick="calculateSI()">Calculate</button>

<div class="result" id="result">Result will appear here</div>

<div class="links">
<a href="percentage-calculator.html">Percentage Calculator</a> |
<a href="time-duration.html">Time Duration</a>
</div>
</div>

<script>
function calculateSI() {
    const p = document.getElementById("principal").value;
    const r = document.getElementById("rate").value;
    const t = document.getElementById("time").value;

    if (p === "" || r === "" || t === "") {
        document.getElementById("result").innerText = "Please enter all values.";
        return;
    }

    const si = (p * r * t) / 100;
    document.getElementById("result").innerText =
        "Simple Interest: " + si.toFixed(2);
}
</script>

</body>
</html>
