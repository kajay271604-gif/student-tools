<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Word Counter for Assignments | Free Student Tool</title>

<meta name="description" content="Free word counter for students. Count words and characters instantly for assignments, exams and essays.">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: white;
    width: 100%;
    max-width: 520px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

h1 {
    text-align: center;
    color: #333;
}

p {
    text-align: center;
    color: #555;
    font-size: 14px;
}

textarea {
    width: 100%;
    height: 180px;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    resize: none;
}

.stats {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    font-weight: bold;
}

.links {
    text-align: center;
    margin-top: 15px;
}

.links a {
    color: #6366f1;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">
<h1>Word Counter</h1>
<p>Count words and characters instantly</p>

<textarea id="textInput" placeholder="Paste your assignment text here..."></textarea>

<div class="stats">
    <div>Words: <span id="wordCount">0</span></div>
    <div>Characters: <span id="charCount">0</span></div>
</div>

<div class="links">
<a href="percentage-calculator.html">Percentage Calculator</a> |
<a href="age-calculator.html">Age Calculator</a>
</div>
</div>

<script>
const textInput = document.getElementById("textInput");
const wordCount = document.getElementById("wordCount");
const charCount = document.getElementById("charCount");

textInput.addEventListener("input", () => {
    const text = textInput.value.trim();
    charCount.innerText = text.length;
    wordCount.innerText = text === "" ? 0 : text.split(/\s+/).length;
});
</script>

</body>
</html>
