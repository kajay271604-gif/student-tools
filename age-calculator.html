<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Age Calculator for Students | Free Online Tool</title>

<meta name="description" content="Free age calculator for students and exam forms. Calculate your exact age in years, months and days instantly.">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: #555;
    font-size: 14px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
    color: #333;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.9;
}

.result {
    margin-top: 20px;
    background: #f4f6f8;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
    color: #333;
}

.links {
    margin-top: 15px;
    text-align: center;
}

.links a {
    color: #667eea;
    text-decoration: none;
    font-size: 14px;
}

footer {
    margin-top: 15px;
    text-align: center;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<div class="card">

<h1>Age Calculator</h1>
<p>Calculate your exact age for exams and forms</p>

<label>Date of Birth</label>
<input type="date" id="dob">

<button onclick="calculateAge()">Calculate Age</button>

<div class="result" id="result">
Your age will appear here
</div>

<div class="links">
<a href="word-counter.html">Word Counter</a> |
<a href="percentage-calculator.html">Percentage Calculator</a>
</div>

<footer>
© 2026 Free Student Tools
</footer>

</div>

<script>
function calculateAge() {
    const dob = new Date(document.getElementById("dob").value);
    const today = new Date();

    if (!document.getElementById("dob").value) {
        document.getElementById("result").innerText = "Please select your date of birth.";
        return;
    }

    let years = today.getFullYear() - dob.getFullYear();
    let months = today.getMonth() - dob.getMonth();
    let days = today.getDate() - dob.getDate();

    if (days < 0) {
        months--;
        days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    document.getElementById("result").innerText =
        `Your Age: ${years} Years, ${months} Months, ${days} Days`;
}
</script>

</body>
</html>
